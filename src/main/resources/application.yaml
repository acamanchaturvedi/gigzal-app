spring:
  application:
    name: gigzal
  datasource:
    driver-class-name: org.postgresql.Driver
    url: "jdbc:postgresql://localhost:5433/app"
    username: postgres
    password: password
  jpa:
    database: POSTGRESQL
    show-sql: true
    hibernate:
      ddl-auto: create
  banner:
    location: classpath:banner.txt
  output:
    ansi:
      enabled: always
jwt-token:
  expire-time: 86400000 #  one day (time in milliseconds)

