openapi: 3.0.3
info:
  title: Swagger Petstore - OpenAPI 3.0
  description: |-
    This is a sample Pet Store Server based on the OpenAPI 3.0 specification.  You can find out more about
    Swagger at [https://swagger.io](https://swagger.io). In the third iteration of the pet store, we've switched to the design first approach!
    You can now help us improve the API whether it's by making changes to the definition itself or to the code.
    That way, with time, we can improve the API in general, and expose some of the new features in OAS3.

    _If you're looking for the Swagger 2.0/OAS 2.0 version of Petstore, then click [here](https://editor.swagger.io/?url=https://petstore.swagger.io/v2/swagger.yaml). Alternatively, you can load via the `Edit > Load Petstore OAS 2.0` menu option!_
    
    Some useful links:
    - [The Pet Store repository](https://github.com/swagger-api/swagger-petstore)
    - [The source API definition for the Pet Store](https://github.com/swagger-api/swagger-petstore/blob/master/src/main/resources/openapi.yaml)
  termsOfService: http://swagger.io/terms/
  contact:
    email: apiteam@swagger.io
  license:
    name: Apache 2.0
    url: http://www.apache.org/licenses/LICENSE-2.0.html
  version: 1.0.11
externalDocs:
  description: Find out more about Swagger
  url: http://swagger.io
tags:
  - name: service
    description: Everything about service
    externalDocs:
      description: Find out more
      url: http://swagger.io
paths:
  /categories:
    get:
      tags:
        - service
      summary: Fetch all categories
      description: Fetch all categories
      operationId: findAllCaregories
      parameters:
        - name: category
          in: query
          description: Filter category based on string provided
          required: false
          schema:
            type: string
        - name: range
          in: header
          description: Range
          required: true
          schema:
            type: string
            default: 0-10
      responses:
        '200':
          description: successful operation
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/CategorySerachResponse'
        '400':
          description: Invalid status value


components:
  schemas:
    CategorySerachResponse:
      type: object
      properties:
        categoryId:
          type: integer
          description: Category Id
          example: 1
        categoryTitle:
          type: string
          description: Category Title
          example: Moving Services
        subTitle:
          type: string
          description: Category Sub Title
          example: From heavy lifting to unpacking make your move with Gigzal
        SkillResponse:
          type: array
          items:
            $ref: '#/components/schemas/Skill'
    Skill:
      type: object
      properties:
        SkillId:
          type: integer
          description: Skill Id
          example: 1
        SkillTitle:
          type: string
          description: Skill Title
          example: Help Moving