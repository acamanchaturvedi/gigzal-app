openapi: 3.0.0
info:
  title: Gigzal - OpenAPI 3.0
  termsOfService: http://swagger.io/terms/
  contact:
    email: acamanchaturvedi@gmail.com
  license:
    name: Apache 2.0
    url: http://www.apache.org/licenses/LICENSE-2.0.html
  version: 1.0.0
servers:
  - url: http://localhost:8080
    description: local server, dev environment
tags:
  - name: authentication
    description: register new user, login user and get access token
  - name: service
    description: Everything about service
paths:
  /register:
    post:
      tags:
        - authentication
      summary: register in app to create a new account
      operationId: register
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RegisterRequest'
      responses:
        '200':
          description: successful operation
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RegisterRequest'
        '400':
          description: Invalid status value
  /login:
    post:
      tags:
        - authentication
      summary: login to app, fetch access token on successful login
      operationId: login
      parameters:
        - name: username
          in: query
          description: Provide the username of the user
          required: true
          schema:
            type: string
          example: aman
        - name: password
          in: query
          description: Provide the password of the user
          required: true
          schema:
            type: string
            format: password
      responses:
        '200':
          description: successful operation
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LoginResponse'
        '400':
          description: Invalid status value
  /categories:
    get:
      tags:
        - service
      summary: Fetch all categories
      description: Fetch all categories
      operationId: findAllCategories
      parameters:
        - name: category
          in: query
          description: Filter category based on string provided
          required: false
          schema:
            type: string
        - name: range
          in: header
          description: Range
          required: true
          schema:
            type: string
            default: 0-10
      responses:
        '200':
          description: successful operation
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/CategorySearchResponse'
        '400':
          description: Invalid status value
components:
  schemas:
    Auditable:
      type: object
      properties:
        createdBy:
          type: string
          example:
        createdDate:
          type: string
          example:
        modifiedBy:
          type: string
          example:
        modifiedDate:
          type: string
          example:
    RegisterRequest:
      allOf:
        - $ref: "#/components/schemas/Auditable"
        - type: object
          required:
            - username
            - password
          properties:
            username:
              type: string
              example: aman1
            password:
              type: string
              example: pass@123
            name:
              type: string
              example: Aman Chaturvedi
            email:
              type: string
              example: acamanchaturvedi@gmail.com
            phone:
              type: string
              example: '+918384960199'
            photoId:
              type: string
              example: 1234
            userRole:
              type: string
              example: USER
            isDeleted:
              type: boolean
              example: false
    LoginResponse:
      type: object
      properties:
        accessToken:
          type: string
          example: >-
            eyJhbGciOiJIUzI1NiJ9.eyJzdWIiOiJhbWFuMSIsImlhdCI6MTcyOTk1MDY2MSwiZXhwIjoxNzMwMDM3MDYxfQ.SpXggj2ZNjmBOqxuB56QAHIkcwU9YQcpE7z11wvuwwE
        expiresInMilliseconds:
          type: integer
          example: 86400000
      required:
        - accessToken
        - expiresInMilliseconds
    CategorySearchResponse:
      type: object
      properties:
        categoryId:
          type: integer
          description: Category Id
          example: 1
        categoryTitle:
          type: string
          description: Category Title
          example: Moving Services
        subTitle:
          type: string
          description: Category Sub Title
          example: From heavy lifting to unpacking make your move with Gigzal
        SkillResponse:
          type: array
          items:
            $ref: '#/components/schemas/Skill'
      required:
        - categoryId
        - categoryTitle
        - subTitle
        - SkillResponse
    Skill:
      type: object
      properties:
        SkillId:
          type: integer
          description: Skill Id
          example: 1
        SkillTitle:
          type: string
          description: Skill Title
          example: Help Moving
      required:
        - SkillId
        - SkillTitle
